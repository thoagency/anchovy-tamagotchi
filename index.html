<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Anchovy Tamagotchi</title>
<link rel="stylesheet" href="style.css">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#4b3a2a">
</head>
<body>
  <div class="device">
    <div class="screen">
      <div class="settings-wrap">
        <button type="button" id="settings-btn" title="AI settings">⚙️</button>
        <div id="settings-menu" class="settings-menu hidden">
          <label for="gemini-key-input" class="settings-label">Gemini API key</label>
          <input id="gemini-key-input" type="password" placeholder="Paste your key here" autocomplete="off" />
          <div id="settings-status" class="settings-status">Offline mode (no key set)</div>
          <div class="settings-buttons">
            <button type="button" id="settings-save">Save</button>
            <button type="button" id="settings-clear">Clear</button>
          </div>

          <div class="gift-divider"></div>

          <span class="settings-label">Shared chat (optional)</span>
          <label for="identity-select" class="settings-sublabel">You are:</label>
          <select id="identity-select">
            <option value="">Choose...</option>
            <option value="thomas">Thomas</option>
            <option value="behazin">Behazin</option>
          </select>
          <input id="supabase-url-input" type="text" placeholder="Supabase project URL" autocomplete="off" />
          <input id="supabase-key-input" type="password" placeholder="Supabase anon key" autocomplete="off" />
          <div id="sync-status" class="settings-status">Not synced (this device only)</div>
          <div class="settings-buttons">
            <button type="button" id="sync-save">Save</button>
            <button type="button" id="sync-clear">Clear</button>
          </div>
        </div>
      </div>

      <div class="stats">
        <div class="stat">
          <span class="stat-label">Hunger</span>
          <div class="bar"><div id="bar-hunger" class="bar-fill"></div></div>
        </div>
        <div class="stat">
          <span class="stat-label">Energy</span>
          <div class="bar"><div id="bar-energy" class="bar-fill"></div></div>
        </div>
        <div class="stat">
          <span class="stat-label">Mood</span>
          <div class="bar"><div id="bar-mood" class="bar-fill"></div></div>
        </div>
      </div>

      <div class="stage">
        <img id="avatar" class="avatar" src="anchy.webp" alt="Anchovy">
      </div>

      <div id="chatlog" class="chatlog"></div>

      <div class="actions">
        <button id="btn-feed" title="Feed him a snack">🐟 Feed</button>
        <button id="btn-nap" title="Let him nap">💤 Nap</button>
        <div class="gift-wrap">
          <button type="button" id="gift-btn" title="Give him a gift">🎁 Gift</button>
          <div id="gift-menu" class="gift-menu hidden">
            <ul class="gift-list">
              <li data-gift="hug"><span class="gift-emoji">🤗</span>Hug</li>
              <li data-gift="lizard"><span class="gift-emoji">🦎</span>A pet lizard</li>
              <li data-gift="hat"><span class="gift-emoji">🎩</span>Hat</li>
              <li data-gift="rock"><span class="gift-emoji">🪨</span><span id="gift-rock-label">Friendship Rock #1</span></li>
            </ul>
            <div class="gift-divider"></div>
            <form id="gift-custom-form" class="gift-custom-form">
              <input id="gift-custom" type="text" placeholder="Type your own gift..." autocomplete="off" />
              <button type="submit">Give</button>
            </form>
          </div>
        </div>
      </div>

      <form id="chat-form" class="chat-form">
        <input id="chat-input" type="text" placeholder="Say something to Anchovy..." autocomplete="off" />
        <button type="submit">Send</button>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="brain.js"></script>
  <script src="llm.js"></script>
  <script src="sync.js"></script>
  <script src="app.js"></script>
  <script>
    if ("serviceWorker" in navigator && location.protocol !== "file:") {
      navigator.serviceWorker.register("sw.js").catch(() => {});
    }
  </script>
</body>
</html>
